name: Iron Music 420 AI v3.4.1 build now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v341-now.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: iron-v341-build-now
  cancel-in-progress: false

jobs:
  build-v341:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      WORK_BRANCH: agent/v3-4-1-unified-assistant-direct
      ARCHIVE_SHA256: 26543a6a95961fb0b31a3b8e54611303d65552a44d446389bb6a75042b11f87c
      RELEASE_TAG: v3.4.1
      PR_NUMBER: '15'

    steps:
      - name: Verify, test, build and publish v3.4.1
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/iron-v341-build.log) 2>&1
          STAGE='initialization'

          comment_file() {
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$1" || true
          }

          report_failure() {
            code=$?
            trap - ERR
            tail -n 80 /tmp/iron-v341-build.log > /tmp/iron-v341-tail.log || true
            {
              echo "v3.4.1 build failed during: ${STAGE}."
              echo
              echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo '```text'
              cat /tmp/iron-v341-tail.log
              echo '```'
            } > /tmp/iron-v341-comment.md
            comment_file /tmp/iron-v341-comment.md
            exit "$code"
          }
          trap report_failure ERR

          printf 'v3.4.1 release build started.\n\nRun: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/iron-v341-start.md
          comment_file /tmp/iron-v341-start.md

          STAGE='fetching the direct source branch'
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$WORK_BRANCH"
          git checkout -B "$WORK_BRANCH" FETCH_HEAD

          STAGE='reconstructing and verifying the source archive'
          test "$(find .v341-direct -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 12
          sha256sum .v341-direct/part-* | tee /tmp/v341-part-checksums.txt
          {
            cat .v341-direct/part-00 .v341-direct/part-01 .v341-direct/part-02 \
                .v341-direct/part-03 .v341-direct/part-04 .v341-direct/part-05
            sed 's/KXNn333Wf/KXNn833Wf/' .v341-direct/part-06
            cat .v341-direct/part-07 .v341-direct/part-08 .v341-direct/part-09 \
                .v341-direct/part-10 .v341-direct/part-11
          } | tr -cd 'A-Za-z0-9+/=' | base64 --decode > /tmp/v341-direct-update.tar.xz
          echo "$ARCHIVE_SHA256  /tmp/v341-direct-update.tar.xz" | sha256sum --check --strict
          tar -tJf /tmp/v341-direct-update.tar.xz
          tar -xJf /tmp/v341-direct-update.tar.xz -C .
          rm -rf .v341-direct
          rm -f .github/workflows/apply-v341-direct.yml

          STAGE='installing Flutter stable'
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter --version
          java -version

          STAGE='preparing signing and offline wake assets'
          base64 --decode android/app/iron-test-key.jks.b64 > android/app/iron-test-key.jks
          keytool -list -keystore android/app/iron-test-key.jks -storepass iron420test -alias iron-test
          bash scripts/prepare_sherpa_kws.sh

          STAGE='resolving Flutter packages'
          flutter pub get

          STAGE='static analysis'
          flutter analyze --no-fatal-warnings --no-fatal-infos

          STAGE='Flutter and bridge tests'
          flutter test

          STAGE='arm64 release compilation'
          flutter build apk --release --target-platform android-arm64 --split-per-abi

          STAGE='APK verification'
          APK='build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/apk-certificate.txt
          sha256sum "$APK" | tee build/iron-music-420-ai-v3.4.1.sha256
          cp "$APK" build/Iron-Music-420-AI-v3.4.1-Unified-Assistant-Core.apk

          STAGE='committing the final v3.4.1 source'
          git add --all ':!build' ':!android/app/iron-test-key.jks'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Iron Music 420 AI v3.4.1: unified assistant core'
          git push origin HEAD:"$WORK_BRANCH"
          FINAL_SHA="$(git rev-parse HEAD)"

          STAGE='publishing the APK release'
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            build/Iron-Music-420-AI-v3.4.1-Unified-Assistant-Core.apk \
            build/iron-music-420-ai-v3.4.1.sha256 \
            build/apk-certificate.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FINAL_SHA" \
            --title 'Iron Music 420 AI v3.4.1 — Unified Assistant Core' \
            --notes 'Verified arm64 release build. Static analysis and all Flutter tests passed before publishing.'

          trap - ERR
          {
            echo 'Iron Music 420 AI v3.4.1 is ready.'
            echo
            echo "Source commit: ${FINAL_SHA}"
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Build run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/iron-v341-success.md
          comment_file /tmp/iron-v341-success.md

