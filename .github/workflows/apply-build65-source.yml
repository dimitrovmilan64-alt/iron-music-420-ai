name: Apply Build 65 Source Patch

on:
  push:
    branches:
      - 'agent/build65-publish-*'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact build 65 patch
        run: |
          set -euo pipefail
          cat patches/build65-common.patch.b64.* | tr -d '\n\r' | base64 -d > /tmp/build65-common.patch
          echo 'e59bb9af7dc64bd49d1cd4da4aa9e4bb0a1c1d546904545b0384590555a48d0c  /tmp/build65-common.patch' | sha256sum -c -
          test "$(git hash-object /tmp/build65-common.patch)" = 'bf719c30a8232cd9eeb7b2c1f6f616513a93554e'
          git apply /tmp/build65-common.patch
          test "$(git hash-object lib/ui/common_widgets.dart)" = 'ba09864bef343b4e440a58b17c7e2a5f58101369'
          grep -q '_ironCannabisLeafSilhouette' lib/ui/common_widgets.dart
          grep -q '_ironLeafTipTargets' lib/ui/common_widgets.dart
          if grep -q 'Size.square(size \* 0.62)' lib/ui/common_widgets.dart; then exit 1; fi
          if grep -q 'Path _leafSilhouette' lib/ui/common_widgets.dart; then exit 1; fi
          git rm patches/build65-common.patch.b64.* .github/workflows/apply-build65-source.yml
          git add lib/ui/common_widgets.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply build 65 real leaf source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
