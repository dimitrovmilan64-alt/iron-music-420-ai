name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply remaining v3.1 changes
        shell: bash
        run: |
          cat .v31remain/part{00..13} | base64 --decode > /tmp/v31-remaining.patch.gz
          echo "89128f2302302c0473f2f1db30919d766f2d546a0a9e722107a96feead6970a9  /tmp/v31-remaining.patch.gz" | sha256sum --check
          gzip -dc /tmp/v31-remaining.patch.gz > /tmp/v31-remaining.patch
          echo "67e56cf3e15a07e5df80f99c9406a23250636c88c15f500625f19f0f9c3dcfb5  /tmp/v31-remaining.patch" | sha256sum --check
          test "$(wc -c < /tmp/v31-remaining.patch)" -eq 83260
          patch -p1 < /tmp/v31-remaining.patch
          rm -rf .v31remain

      - name: Commit v3.1 implementation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Complete v3.1 conversational assistant
          branch: ${{ github.head_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.1.0-conversation-ui
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
