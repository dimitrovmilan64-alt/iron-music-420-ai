name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze provider fallback
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/main.dart
          lib/pages/chat_page.dart
          lib/pages/rap_studio_page.dart
          lib/services/ai_provider_config.dart
          lib/services/gemini_service.dart
          lib/services/local_store.dart
          lib/services/automation_service.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Test provider fallback and small-screen layout
        run: >-
          flutter test
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.3.0-provider-fallback
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
