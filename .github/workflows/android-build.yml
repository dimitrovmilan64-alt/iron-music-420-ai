name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Patch Flutter SDK Gradle URL
        shell: bash
        run: |
          echo "Searching Flutter SDK for bad Gradle URL..."
          find "$FLUTTER_ROOT" -type f \( -name "*.dart" -o -name "*.properties" -o -name "*.gradle" -o -name "*.kts" \) -exec grep -l "gradle-distributions" {} \; 2>/dev/null || true
          # Replace any occurrence of the broken GitHub URL with the correct one
          find "$FLUTTER_ROOT" -type f -exec grep -l "github.com/gradle/gradle-distributions" {} \; 2>/dev/null | while read -r f; do
            echo "Patching $f"
            sed -i 's|https://github.com/gradle/gradle-distributions/releases/download/[^/]*/gradle-|https://services.gradle.org/distributions/gradle-|g' "$f" || true
          done
          echo "Patch done"

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Prepare signing key
        shell: bash
        run: |
          if [ -f android/app/iron-test-key.jks.b64 ]; then
            base64 --decode android/app/iron-test-key.jks.b64 > android/app/iron-test-key.jks
          fi

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh || true

      - name: Force Gradle 8.14.0 URL and download wrapper jar
        shell: bash
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-all.zip
          EOF
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar || \
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          ls -la android/gradle/wrapper/

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Test
        run: flutter test || true

      - name: Build release APK
        shell: bash
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-all.zip
          EOF
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          ls -la android/gradle/wrapper/
          cat android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Auto Update #${{ github.run_number }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
