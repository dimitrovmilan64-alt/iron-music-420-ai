name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout speech timeout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect pending v3.3.1 migration
        id: migration
        shell: bash
        run: |
          if grep -q '^version: 3.3.1+39$' pubspec.yaml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply v3.3.1 microphone timeout fix
        if: steps.migration.outputs.needed == 'true'
        run: python3 scripts/apply_v331_speech_timeout_fix.py

      - name: Commit v3.3.1 source
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          rm scripts/apply_v331_speech_timeout_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            lib/pages/chat_page.dart \
            pubspec.yaml \
            CHANGELOG_V331_SPEECH_TIMEOUT.md \
            scripts/apply_v331_speech_timeout_fix.py
          git diff --cached --check
          git commit -m "Fix Android speech timeout handling in v3.3.1"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze microphone retry fix
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/main.dart
          lib/pages/chat_page.dart
          lib/services/speech_error_policy.dart
          test/speech_error_policy_test.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Test microphone policy, provider fallback and layout
        run: >-
          flutter test
          test/speech_error_policy_test.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.3.1-speech-timeout-fix
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
