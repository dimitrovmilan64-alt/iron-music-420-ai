name: One-shot Iron Music 420 AI v3.4.1 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: iron-v341-one-shot
  cancel-in-progress: true

env:
  WORK_BRANCH: agent/v3-4-1-unified-assistant-direct
  ARCHIVE_SHA256: 26543a6a95961fb0b31a3b8e54611303d65552a44d446389bb6a75042b11f87c

jobs:
  build-v341:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Fetch verified v3.4.1 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$WORK_BRANCH"
          git checkout -B "$WORK_BRANCH" FETCH_HEAD

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .v341-direct -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 12
          sha256sum .v341-direct/part-* | tee /tmp/v341-part-checksums.txt
          {
            cat .v341-direct/part-00 .v341-direct/part-01 .v341-direct/part-02 \
                .v341-direct/part-03 .v341-direct/part-04 .v341-direct/part-05
            sed 's/KXNn333Wf/KXNn833Wf/' .v341-direct/part-06
            cat .v341-direct/part-07 .v341-direct/part-08 .v341-direct/part-09 \
                .v341-direct/part-10 .v341-direct/part-11
          } | tr -cd 'A-Za-z0-9+/=' | base64 --decode > /tmp/v341-direct-update.tar.xz
          echo "$ARCHIVE_SHA256  /tmp/v341-direct-update.tar.xz" | sha256sum --check --strict
          tar -tJf /tmp/v341-direct-update.tar.xz
          tar -xJf /tmp/v341-direct-update.tar.xz -C .
          rm -rf .v341-direct
          rm -f .github/workflows/apply-v341-direct.yml

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          java -version

      - name: Prepare signing key and offline wake engine
        shell: bash
        run: |
          base64 --decode android/app/iron-test-key.jks.b64 > android/app/iron-test-key.jks
          keytool -list \
            -keystore android/app/iron-test-key.jks \
            -storepass iron420test \
            -alias iron-test
          bash scripts/prepare_sherpa_kws.sh

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze v3.4.1
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run all tests
        run: flutter test

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Verify APK and commit final source
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/apk-certificate.txt
          sha256sum "$APK" | tee build/iron-music-420-ai-v3.4.1.sha256
          cp "$APK" build/Iron-Music-420-AI-v3.4.1-Unified-Assistant-Core.apk
          git add --all ':!build'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Iron Music 420 AI v3.4.1: unified assistant core'
          git push origin HEAD:"$WORK_BRANCH"

      - name: Upload v3.4.1 release APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.4.1-unified-assistant-core
          path: |
            build/Iron-Music-420-AI-v3.4.1-Unified-Assistant-Core.apk
            build/iron-music-420-ai-v3.4.1.sha256
            build/apk-certificate.txt
          if-no-files-found: error
          retention-days: 30
