name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply responsive UI fix
        if: ${{ hashFiles('scripts/apply_v312_responsive_ui.py') != '' }}
        run: python3 scripts/apply_v312_responsive_ui.py

      - name: Commit responsive UI source
        if: ${{ hashFiles('scripts/apply_v312_responsive_ui.py') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG_V312_RESPONSIVE_UI.txt')
          clean = '\n'.join(line.rstrip() for line in path.read_text().splitlines()).rstrip() + '\n'
          path.write_text(clean)
          PY
          rm scripts/apply_v312_responsive_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/chat_page.dart pubspec.yaml CHANGELOG_V312_RESPONSIVE_UI.txt scripts/apply_v312_responsive_ui.py
          git diff --cached --check
          git commit -m "Fix v3.1.2 responsive chat layout"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze responsive UI
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/pages/chat_page.dart

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.1.2-responsive-ui
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
