name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare stable test signing key
        shell: bash
        run: |
          base64 --decode android/app/iron-test-key.jks.b64 > android/app/iron-test-key.jks
          keytool -list \
            -keystore android/app/iron-test-key.jks \
            -storepass iron420test \
            -alias iron-test

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze native speech build
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/main.dart
          lib/pages/chat_page.dart
          lib/pages/rap_studio_page.dart
          lib/services/ai_provider_config.dart
          lib/services/gemini_service.dart
          lib/services/local_store.dart
          lib/services/automation_service.dart
          test/native_speech_bridge_test.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Test native speech bridge, provider fallback and layout
        run: >-
          flutter test
          test/native_speech_bridge_test.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify stable APK certificate
        shell: bash
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk \
            | grep -F 'SHA256: 8C:04:DC:89:B1:66:16:B0:03:8F:66:C6:06:27:0A:13:25:F0:4D:57:FE:8E:F7:04:99:F4:77:27:4F:4C:73:B3'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.3.3-stable-signing
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
