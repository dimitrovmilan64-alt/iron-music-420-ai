name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout native speech branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect pending v3.3.2 migration
        id: migration
        shell: bash
        run: |
          if grep -q '^version: 3.3.2+40$' pubspec.yaml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply native Android speech migration
        if: steps.migration.outputs.needed == 'true'
        run: python3 scripts/apply_v332_native_speech.py

      - name: Apply native speech preflight fixes
        if: steps.migration.outputs.needed == 'true'
        run: python3 scripts/fix_v332_native_speech.py

      - name: Commit v3.3.2 source
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          rm scripts/apply_v332_native_speech.py
          rm scripts/fix_v332_native_speech.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            android/app/src/main/kotlin/com/example/ironmusic420ai/MainActivity.kt \
            lib/pages/chat_page.dart \
            lib/services/automation_service.dart \
            pubspec.yaml \
            CHANGELOG_V332_NATIVE_SPEECH.md \
            scripts/apply_v332_native_speech.py \
            scripts/fix_v332_native_speech.py
          git diff --cached --check
          git commit -m "Replace chat microphone with native Android speech"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze native speech build
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/main.dart
          lib/pages/chat_page.dart
          lib/pages/rap_studio_page.dart
          lib/services/ai_provider_config.dart
          lib/services/gemini_service.dart
          lib/services/local_store.dart
          lib/services/automation_service.dart
          test/native_speech_bridge_test.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Test native speech bridge, provider fallback and layout
        run: >-
          flutter test
          test/native_speech_bridge_test.dart
          test/ai_provider_fallback_test.dart
          test/chat_layout_test.dart

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.3.2-native-speech
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
