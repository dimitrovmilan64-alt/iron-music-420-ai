name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Prepare signing key
        shell: bash
        env:
          IRON_KEYSTORE_B64: ${{ secrets.IRON_KEYSTORE_B64 }}
        run: |
          if [ -n "${IRON_KEYSTORE_B64:-}" ]; then
            mkdir -p android/app
            printf '%s' "$IRON_KEYSTORE_B64" | base64 --decode > android/app/iron-release.jks
            echo "IRON_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/app/iron-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded from IRON_KEYSTORE_B64."
          else
            echo "IRON_KEYSTORE_B64 secret is not set; the release APK will use debug signing."
          fi

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Verify Hey Iron runtime assets
        shell: bash
        run: |
          SERVICE="android/app/src/main/kotlin/com/example/ironmusic420ai/IronVoiceService.kt"
          AAR="android/app/libs/sherpa-onnx-1.13.4.aar"
          test -s "$AAR" || { echo "Missing sherpa-onnx AAR"; exit 1; }
          if grep -q 'const val SERVICE_ENABLED = true' "$SERVICE"; then
            MODEL="android/app/src/main/assets/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20"
            for f in encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx \
                     decoder-epoch-13-avg-2-chunk-16-left-64.onnx \
                     joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx \
                     tokens.txt keywords.txt; do
              test -s "$MODEL/$f" || { echo "Missing model file: $f"; exit 1; }
            done
            echo "Offline Hey Iron models verified."
          else
            echo "Hey Iron is disabled; AAR is present for compile, models were skipped."
          fi

      - name: Force Gradle 8.10 URL
        shell: bash
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
          EOF
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.10.0/gradle/wrapper/gradle-wrapper.jar || true
          ls -la android/gradle/wrapper/
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        shell: bash
        env:
          IRON_KEYSTORE_PATH: ${{ env.IRON_KEYSTORE_PATH }}
          IRON_KEYSTORE_PASSWORD: ${{ secrets.IRON_KEYSTORE_PASSWORD }}
          IRON_KEY_ALIAS: ${{ secrets.IRON_KEY_ALIAS }}
          IRON_KEY_PASSWORD: ${{ secrets.IRON_KEY_PASSWORD }}
        run: |
          # Force again right before build
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Auto Update #${{ github.run_number }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
