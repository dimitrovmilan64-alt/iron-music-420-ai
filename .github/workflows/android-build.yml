name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply v3 AI implementation
        shell: bash
        run: |
          if [[ -d .v3patch ]]; then
            wc -c .v3patch/part05a .v3patch/part05b
            sha256sum .v3patch/part05a .v3patch/part05b
            cat \
              .v3patch/part00 \
              .v3patch/part01 \
              .v3patch/part02 \
              .v3patch/part03 \
              .v3patch/part04 \
              .v3patch/part05a \
              .v3patch/part05b \
              | base64 --decode > /tmp/v3-ai-mode.patch
            wc -c /tmp/v3-ai-mode.patch
            sha256sum /tmp/v3-ai-mode.patch
            echo "a06dbdd920918391bd6f86b60907f67026e4c597ec79f8bb69542d5d5d1d9a3e  /tmp/v3-ai-mode.patch" | sha256sum --check
            patch -p1 < /tmp/v3-ai-mode.patch
            rm -rf .v3patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Implement v3 AI voice mode"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.0.0-ai-voice-mode
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
