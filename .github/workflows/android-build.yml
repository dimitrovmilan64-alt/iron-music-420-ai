name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply build 60 clean core patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}')
              p.write_text(text.replace(old, new, 1))

          replace('pubspec.yaml', 'version: 3.4.0+59', 'version: 3.4.0+60')
          replace(
              'lib/main.dart',
              '      ChatPage(\n        store: widget.store,\n        onOpenTools: () => _openSection(4),\n        onOpenSongs: () => _openSection(2),',
              '      ChatPage(\n        store: widget.store,\n        onOpenTools: () => _openSection(4),\n        onOpenStudio: () => _openSection(1),\n        onOpenSongs: () => _openSection(2),',
          )
          replace(
              'lib/main.dart',
              '''      bottomNavigationBar: IronBottomNavigation(
        selectedIndex: _currentIndex < _navItems.length ? _currentIndex : 0,
        onSelected: _openSection,
        items: _navItems,
      ),''',
              '''      bottomNavigationBar: _currentIndex == 0
          ? null
          : IronBottomNavigation(
              selectedIndex:
                  _currentIndex < _navItems.length ? _currentIndex : 0,
              onSelected: _openSection,
              items: _navItems,
            ),''',
          )
          replace(
              'lib/pages/chat_page.dart',
              '  final VoidCallback? onOpenTools;\n  final VoidCallback? onOpenSongs;',
              '  final VoidCallback? onOpenTools;\n  final VoidCallback? onOpenStudio;\n  final VoidCallback? onOpenSongs;',
          )
          replace(
              'lib/pages/chat_page.dart',
              '    required this.store,\n    this.onOpenTools,\n    this.onOpenSongs,',
              '    required this.store,\n    this.onOpenTools,\n    this.onOpenStudio,\n    this.onOpenSongs,',
          )

          chat = Path('lib/pages/chat_page.dart')
          text = chat.read_text()
          helper_marker = '  Widget _buildAssistantCore(double size) {'
          helper = r'''
  Widget _coreDockButton({
    required IconData icon,
    required String label,
    required VoidCallback? onTap,
    bool active = false,
  }) {
    final color = active ? ironGreenSoft : Colors.white70;
    return Expanded(
      child: Material(
        color: Colors.transparent,
        borderRadius: BorderRadius.circular(22),
        child: InkWell(
          onTap: onTap,
          borderRadius: BorderRadius.circular(22),
          child: AnimatedContainer(
            duration: const Duration(milliseconds: 180),
            height: 58,
            decoration: BoxDecoration(
              color: active
                  ? ironGreen.withOpacity(0.16)
                  : Colors.white.withOpacity(0.04),
              borderRadius: BorderRadius.circular(22),
              border: Border.all(
                color: active
                    ? ironGreen.withOpacity(0.62)
                    : Colors.white.withOpacity(0.10),
              ),
            ),
            child: Column(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                Icon(icon, color: color, size: 22),
                const SizedBox(height: 3),
                Text(
                  label,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: TextStyle(
                    color: color,
                    fontSize: 10.5,
                    fontWeight: FontWeight.w800,
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

'''
          if helper_marker not in text:
              raise SystemExit('Missing assistant core marker')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          start = text.index('  Widget _buildHudDashboard() {')
          end = text.index('\n  Widget _buildChatMode() {', start)
          new_dashboard = r'''
  Widget _buildHudDashboard() {
    final media = MediaQuery.of(context);
    final compactHeight = media.size.height < 760;
    final coreSize = (media.size.width * (compactHeight ? 0.86 : 0.94))
        .clamp(300.0, 410.0)
        .toDouble();

    return IronBackground(
      child: SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(16, 8, 16, 14),
          child: Column(
            children: [
              Row(
                children: [
                  _hudChip(
                    icon: Icons.circle_rounded,
                    label: _ironActive ? 'ONLINE' : 'STANDBY',
                    active: _ironActive,
                  ),
                  const Spacer(),
                  PopupMenuButton<String>(
                    tooltip: 'Настройки',
                    icon: const Icon(
                      Icons.more_horiz_rounded,
                      color: ironGreen,
                    ),
                    onSelected: (value) {
                      if (value == 'api') {
                        _openApiKeySheet();
                      } else if (value == 'voice') {
                        _openVoiceSettings();
                      } else if (value == 'history') {
                        _clearHistory();
                      } else if (value == 'tools') {
                        widget.onOpenTools?.call();
                      } else if (value == 'studio') {
                        widget.onOpenStudio?.call();
                      } else if (value == 'songs') {
                        widget.onOpenSongs?.call();
                      }
                    },
                    itemBuilder: (context) => [
                      const PopupMenuItem(
                        value: 'api',
                        child: Text('AI доставчици'),
                      ),
                      const PopupMenuItem(
                        value: 'voice',
                        child: Text('Настройки на гласа'),
                      ),
                      if (widget.onOpenSongs != null)
                        const PopupMenuItem(
                          value: 'songs',
                          child: Text('Песни'),
                        ),
                      if (widget.onOpenStudio != null)
                        const PopupMenuItem(
                          value: 'studio',
                          child: Text('Студио'),
                        ),
                      if (widget.onOpenTools != null)
                        const PopupMenuItem(
                          value: 'tools',
                          child: Text('Инструменти'),
                        ),
                      const PopupMenuItem(
                        value: 'history',
                        child: Text('Изчисти историята'),
                      ),
                    ],
                  ),
                ],
              ),
              Expanded(
                child: AnimatedBuilder(
                  animation: _coreController,
                  builder: (context, _) {
                    final coreState = switch ((_isListening, _isSpeaking, _isLoading)) {
                      (true, _, _) => IronCoreState.listening,
                      (_, true, _) => IronCoreState.speaking,
                      (_, _, true) => IronCoreState.thinking,
                      _ => IronCoreState.idle,
                    };
                    final status = switch (coreState) {
                      IronCoreState.listening => 'СЛУШАМ',
                      IronCoreState.thinking => 'МИСЛЯ',
                      IronCoreState.speaking => 'ГОВОРЯ',
                      IronCoreState.idle => _ironActive
                          ? 'КАЖИ „ХЕЙ АЙРЪН“'
                          : 'ДОКОСНИ ЯДРОТО',
                    };
                    final statusColor = switch (coreState) {
                      IronCoreState.listening => const Color(0xFF70FFB0),
                      IronCoreState.thinking => const Color(0xFF00E5A0),
                      IronCoreState.speaking => const Color(0xFFA8FF70),
                      IronCoreState.idle => ironGreen,
                    };
                    return LayoutBuilder(
                      builder: (context, constraints) {
                        final safeCoreSize = coreSize
                            .clamp(260.0, constraints.maxHeight * 0.72)
                            .toDouble();
                        return Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Text(
                              'IRON',
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: 36,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 7,
                              ),
                            ),
                            Text(
                              'MUSIC 420 AI',
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                color: Colors.white.withOpacity(0.78),
                                fontSize: 13,
                                fontWeight: FontWeight.w700,
                                letterSpacing: 2.5,
                              ),
                            ),
                            SizedBox(height: compactHeight ? 6 : 14),
                            GestureDetector(
                              onTap: _isLoading ? null : _toggleListening,
                              child: AnimatedScale(
                                duration: const Duration(milliseconds: 180),
                                scale: _isListening ? 1.035 : 1.0,
                                child: CannabisCore(
                                  progress: _coreController.value,
                                  size: safeCoreSize,
                                  state: coreState,
                                ),
                              ),
                            ),
                            SizedBox(height: compactHeight ? 8 : 16),
                            AnimatedSwitcher(
                              duration: const Duration(milliseconds: 180),
                              child: Text(
                                status,
                                key: ValueKey(status),
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  color: statusColor,
                                  fontSize: 13,
                                  fontWeight: FontWeight.w900,
                                  letterSpacing: 2.2,
                                  shadows: [
                                    Shadow(color: statusColor, blurRadius: 12),
                                  ],
                                ),
                              ),
                            ),
                            const SizedBox(height: 6),
                            Text(
                              _ironActive
                                  ? 'живото ядро слуша за теб'
                                  : 'докосни за разговор',
                              textAlign: TextAlign.center,
                              style: TextStyle(
                                color: Colors.white.withOpacity(0.58),
                                fontSize: 12,
                                fontWeight: FontWeight.w600,
                              ),
                            ),
                          ],
                        );
                      },
                    );
                  },
                ),
              ),
              Container(
                padding: const EdgeInsets.all(10),
                decoration: BoxDecoration(
                  color: Colors.black.withOpacity(0.34),
                  borderRadius: BorderRadius.circular(30),
                  border: Border.all(color: ironGreen.withOpacity(0.20)),
                  boxShadow: [
                    BoxShadow(
                      color: ironGreen.withOpacity(0.10),
                      blurRadius: 24,
                      offset: const Offset(0, 8),
                    ),
                  ],
                ),
                child: Row(
                  children: [
                    _coreDockButton(
                      icon: Icons.chat_bubble_outline_rounded,
                      label: 'Чат',
                      onTap: _openChatPanel,
                    ),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Tooltip(
                        message: _isListening ? 'Спри слушането' : 'Говори',
                        child: FilledButton(
                          onPressed: _isLoading ? null : _toggleListening,
                          style: FilledButton.styleFrom(
                            minimumSize: const Size.fromHeight(58),
                            shape: const CircleBorder(),
                            padding: EdgeInsets.zero,
                            backgroundColor:
                                _isListening ? Colors.redAccent : ironGreen,
                            foregroundColor: Colors.black,
                          ),
                          child: Icon(
                            _isListening
                                ? Icons.stop_rounded
                                : Icons.mic_rounded,
                            size: 28,
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(width: 10),
                    _coreDockButton(
                      icon: widget.store.voiceRepliesEnabled
                          ? Icons.volume_up_rounded
                          : Icons.volume_off_rounded,
                      label: 'Глас',
                      active: widget.store.voiceRepliesEnabled,
                      onTap: _toggleVoiceReplies,
                    ),
                  ],
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
'''
          text = text[:start] + new_dashboard + text[end:]
          chat.write_text(text)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare stable test signing key
        shell: bash
        run: |
          base64 --decode android/app/iron-test-key.jks.b64 > android/app/iron-test-key.jks
          keytool -list \
            -keystore android/app/iron-test-key.jks \
            -storepass iron420test \
            -alias iron-test
      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh
      - name: Get Flutter packages
        run: flutter pub get
      - name: Analyze v3.4.0 build 60
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify stable APK certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk \
            | tee /tmp/iron-apk-certificate.txt
          grep -Fi \
            'certificate SHA-256 digest: 8c04dc89b16616b0038f66c606270a1325f04d57fe8ef70499f477274f4c73b3' \
            /tmp/iron-apk-certificate.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.4.0-build60-clean-core-interface
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
