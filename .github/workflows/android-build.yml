name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply v3.2 clean UI source
        if: ${{ hashFiles('scripts/apply_v320_clean_ui.py') != '' }}
        run: python3 scripts/apply_v320_clean_ui.py

      - name: Commit clean source and remove migration files
        if: ${{ hashFiles('scripts/apply_v320_clean_ui.py') != '' }}
        shell: bash
        run: |
          rm scripts/apply_v320_clean_ui.py
          rm -f .github/workflows/apply-v320-clean-ui.yml
          cat > .github/workflows/android-build.yml <<'YAML'
          name: Android build

          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main

          concurrency:
            group: android-build-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            build-apk:
              runs-on: ubuntu-latest
              timeout-minutes: 40

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Flutter
                  uses: subosito/flutter-action@v2
                  with:
                    channel: stable
                    cache: true

                - name: Prepare offline Hey Iron engine
                  run: bash scripts/prepare_sherpa_kws.sh

                - name: Get Flutter packages
                  run: flutter pub get

                - name: Analyze clean UI
                  run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/main.dart lib/pages/chat_page.dart

                - name: Test small-screen layout
                  run: flutter test test/chat_layout_test.dart

                - name: Build arm64 debug APK
                  run: flutter build apk --debug --target-platform android-arm64

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: iron-music-420-ai-v3.2.0-clean-ui
                    path: build/app/outputs/flutter-apk/app-debug.apk
                    if-no-files-found: error
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build v3.2 clean UI from stable v3.0"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare offline Hey Iron engine
        run: bash scripts/prepare_sherpa_kws.sh

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze clean UI
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/main.dart lib/pages/chat_page.dart

      - name: Test small-screen layout
        run: flutter test test/chat_layout_test.dart

      - name: Build arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-music-420-ai-v3.2.0-clean-ui
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
