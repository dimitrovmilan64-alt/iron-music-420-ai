name: Apply Build 57 single leaf HUD

on:
  push:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply-build57:
    if: github.event.head_commit.message == 'Add one-time Build 57 single leaf updater'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Build 57 patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          common = Path('lib/ui/common_widgets.dart')
          text = common.read_text()
          text = text.replace("""    final leafOffset = Offset(
      math.sin(cycle * 0.72) * size * 0.018,
      math.cos(cycle * 0.58) * size * 0.010,
    );
    final leafTransform = Matrix4.identity()
      ..setEntry(3, 2, 0.0014)
      ..rotateX(math.sin(cycle * 0.54) * 0.055)
      ..rotateY(math.cos(cycle * 0.46) * 0.070);

""", "")
          start = text.index("""            Transform.translate(
              offset: leafOffset,""")
          end = text.index("""            Positioned.fill(
              child: IgnorePointer(""", start)
          text = text[:start] + text[end:]
          class_start = text.index('\nclass _CannabisLeafPainter extends CustomPainter {')
          text = text[:class_start].rstrip() + '\n'
          common.write_text(text)

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text().replace('version: 3.4.0+56', 'version: 3.4.0+57')
          pubspec.write_text(text)

          workflow = Path('.github/workflows/android-build.yml')
          text = workflow.read_text()
          text = text.replace('Analyze v3.4.0 build 56', 'Analyze v3.4.0 build 57')
          text = text.replace('iron-music-420-ai-v3.4.0-build56-hud-control-center', 'iron-music-420-ai-v3.4.0-build57-single-leaf-hud')
          workflow.write_text(text)

          readme = Path('README.md')
          readme.write_text("""# Iron Music 420 AI

Flutter Android app for the Iron Music 420 AI Bulgarian voice/chat assistant.

## Current main build

- Version: `3.4.0+57`
- Build name: `v3.4.0 build 57 single-leaf HUD`
- APK artifact: `iron-music-420-ai-v3.4.0-build57-single-leaf-hud`

## Build 57 single-leaf HUD

- Makes the first screen a HUD control center instead of the chat stream.
- Keeps one large glowing cannabis leaf inside the core.
- Moves the chat behind `CHAT` and `KEYBOARD` actions.
- Adds working HUD actions for commands, songs, flashlight, settings and voice.
- Keeps the existing signed Android package so the APK can update the installed app.
""")

          changelog = Path('CHANGELOG_V340_SINGLE_CHAT_VOICE_CORE.md')
          text = changelog.read_text()
          if '## Build 57 single-leaf HUD' not in text:
              text += """

## Build 57 single-leaf HUD

- Removes the extra painted cannabis overlay from the core.
- Keeps the generated `hud_core_exact.png` core leaf as the single visible leaf.
- Preserves the HUD-first layout and the fixed Bulgarian voice path.
"""
          changelog.write_text(text)

          test = Path('test/unified_hey_iron_chat_test.dart')
          text = test.read_text()
          text = text.replace("    expect(widgets, contains('Matrix4.identity()'));", "    expect(widgets, contains('assets/images/hud_core_exact.png'));\n    expect(widgets, isNot(contains('class _CannabisLeafPainter')));")
          test.write_text(text)

          Path('.github/workflows/apply-build57-single-leaf.yml').unlink(missing_ok=True)
          PY

      - name: Commit Build 57
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build 57 single leaf HUD"
          git push
