name: Apply v3.4.1 update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-v341-update
  cancel-in-progress: true

env:
  PATCH_SHA256: f8548618840c49561441f0c9b43cc8cc3e76a62b083e9c58d98ccce0616d87f3
  WORK_BRANCH: agent/v3-4-1-unified-assistant-core
  SNAPSHOT_SHA: cb354d54ba7057cdf0fa6458cf442c6f201e990c

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch working branch without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$WORK_BRANCH"
          git checkout -B "$WORK_BRANCH" FETCH_HEAD
          git fetch --depth=1 origin "$SNAPSHOT_SHA"
          git checkout FETCH_HEAD -- .github/workflows/android-build.yml .github/workflows/source-snapshot.yml

      - name: Apply verified source patch
        shell: bash
        run: |
          test -f .v341-update/READY
          cat .v341-update/part-*.txt | base64 --decode | gzip --decompress > /tmp/v341.patch
          echo "$PATCH_SHA256  /tmp/v341.patch" | sha256sum --check --strict
          git apply --check /tmp/v341.patch
          git apply /tmp/v341.patch
          rm -rf .v341-update
          rm -f .github/workflows/apply-v341-update.yml
          git add --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Iron Music 420 AI v3.4.1: unified assistant core'
          git push origin HEAD:"$WORK_BRANCH"
