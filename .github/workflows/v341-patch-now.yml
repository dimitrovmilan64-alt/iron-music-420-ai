name: Iron Music 420 AI v3.4.1 verified patch now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v341-patch-now.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: iron-v341-verified-patch-now
  cancel-in-progress: false

env:
  PATCH_SHA256: f8548618840c49561441f0c9b43cc8cc3e76a62b083e9c58d98ccce0616d87f3
  WORK_BRANCH: agent/v3-4-1-unified-assistant-core
  SNAPSHOT_SHA: cb354d54ba7057cdf0fa6458cf442c6f201e990c
  PR_NUMBER: '14'

jobs:
  apply-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch verified patch branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$WORK_BRANCH"
          git checkout -B "$WORK_BRANCH" FETCH_HEAD
          git fetch --depth=1 origin "$SNAPSHOT_SHA"
          git checkout FETCH_HEAD -- .github/workflows/android-build.yml .github/workflows/source-snapshot.yml

      - name: Verify and apply v3.4.1 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .v341-update/READY
          test "$(find .v341-update -maxdepth 1 -type f -name 'part-*.txt' | wc -l)" -eq 9
          cat .v341-update/part-*.txt \
            | tr -cd 'A-Za-z0-9+/=' \
            | base64 --decode \
            | gzip --decompress > /tmp/v341.patch
          echo "$PATCH_SHA256  /tmp/v341.patch" | sha256sum --check --strict
          git apply --check /tmp/v341.patch
          git apply /tmp/v341.patch
          rm -rf .v341-update
          rm -f .github/workflows/apply-v341-update.yml

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth=1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Analyze and test
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Build arm64 release APK
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          base64 --decode android/app/iron-test-key.jks.b64 > android/app/iron-test-key.jks
          bash scripts/prepare_sherpa_kws.sh
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          APK='build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$APK"
          sha256sum "$APK" | tee build/iron-music-420-ai-v3.4.1.sha256
          cp "$APK" build/Iron-Music-420-AI-v3.4.1.apk

      - name: Commit verified source and publish release
        shell: bash
        run: |
          set -Eeuo pipefail
          git add --all ':!build' ':!android/app/iron-test-key.jks'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Iron Music 420 AI v3.4.1: unified assistant core'
          git push origin HEAD:"$WORK_BRANCH"
          FINAL_SHA="$(git rev-parse HEAD)"
          gh release delete v3.4.1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v3.4.1 \
            build/Iron-Music-420-AI-v3.4.1.apk \
            build/iron-music-420-ai-v3.4.1.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FINAL_SHA" \
            --title 'Iron Music 420 AI v3.4.1' \
            --notes 'Verified patch, analysis, tests and arm64 release build passed.'
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "v3.4.1 build completed successfully. Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v3.4.1"

