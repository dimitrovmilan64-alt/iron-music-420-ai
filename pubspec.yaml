name: ironmusic420ai
description: Iron Music 420 AI - Bulgarian rap assistant with Gemini, voice and Rap Studio.
publish_to: 'none'

version: 3.6.0+406

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_tts: 4.2.5
  audioplayers: ^6.5.1
  shared_preferences: ^2.3.5
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hud_core_exact.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
