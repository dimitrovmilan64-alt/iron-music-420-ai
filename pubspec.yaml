name: ironmusic420ai
description: Iron Music 420 AI - Bulgarian rap assistant with Gemini, voice and Rap Studio.
publish_to: 'none'

version: 2.6.5+29

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_tts: 4.2.5
  speech_to_text: ^7.4.0
  shared_preferences: ^2.3.5
  share_plus: ^10.1.4

dependency_overrides:
  # FlutLab workaround: its cached vector_math 2.1.4 is incomplete.
  # 2.1.5 is API-compatible and forces a clean package download.
  vector_math: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hud_core_exact.png
